<svg xmlns="http://www.w3.org/2000/svg" width="390" height="885" viewBox="0 0 390 885" overflow="visible"><g font-family="Segoe UI,Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif"><text x="24" y="12" font-size="12" fill="#71766C" font-weight="500" letter-spacing="1.2">精选项目</text><text x="24" y="51" font-size="29" fill="#242822" font-weight="500" letter-spacing="-1">把想法，做成作品。</text><g id="Featured-notes"><rect x="24" y="82" width="342" height="499" rx="16" fill="#DDE5D5" stroke="none"/><rect x="46" y="104" width="86" height="27" rx="14" fill="#F6F8EF" stroke="none"/><text x="61" y="122" font-size="12" fill="#2853E8" font-weight="600" >最近推出</text><text x="46" y="173" font-size="33" fill="#242822" font-weight="550" >Paper Notes</text><svg id="Cover-notes" x="38" y="215" width="314" height="177" viewBox="0 0 720 400" preserveAspectRatio="xMidYMid slice"><rect x="0" y="0" width="720" height="400" rx="0" fill="#DDE5D5" stroke="none"/><circle cx="678" cy="45" r="176" fill="#D2DDC6" stroke="none"/><circle cx="16" cy="401" r="148" fill="none" stroke="#BECBB2"/><g transform="translate(91,64) rotate(-5,270,140)"><rect x="6" y="14" width="542" height="290" rx="10" fill="#BCC8AF" stroke="none"/><rect x="0" y="0" width="542" height="290" rx="10" fill="#FDFCF8" stroke="none"/><rect x="0" y="0" width="128" height="290" rx="10" fill="#ECEFE5" stroke="none"/><text x="20" y="36" font-size="22" fill="#242822" font-weight="650" >paper.</text><rect x="12" y="62" width="104" height="31" rx="5" fill="#D5DFC7" stroke="none"/><text x="23" y="83" font-size="12" fill="#242822" font-weight="550" >所有笔记</text><text x="23" y="116" font-size="12" fill="#71766C" font-weight="400" >灵感收藏</text><text x="23" y="149" font-size="12" fill="#71766C" font-weight="400" >随手记录</text><text x="155" y="49" font-size="24" fill="#242822" font-weight="600" >给灵感，一个栖息地。</text><text x="155" y="77" font-size="12" fill="#71766C" font-weight="400" >写下此刻，留给未来。</text><rect x="156" y="107" width="111" height="137" rx="5" fill="#F4EDDA" stroke="none"/><text x="168" y="133" font-size="12" fill="#242822" font-weight="600" >灵感碎片</text><text x="168" y="158" font-size="9" fill="#71766C" font-weight="400" >从一个小想法开始</text><path d="M168 180H251" fill="none" stroke="#C5C9BC"/><path d="M168 197H238" fill="none" stroke="#C5C9BC"/><circle cx="172" cy="226" r="3" fill="#86957D" stroke="none"/><rect x="282" y="107" width="111" height="137" rx="5" fill="#E6ECD9" stroke="none"/><text x="294" y="133" font-size="12" fill="#242822" font-weight="600" >今日阅读</text><text x="294" y="158" font-size="9" fill="#71766C" font-weight="400" >慢慢读，也慢慢想</text><path d="M294 180H377" fill="none" stroke="#C5C9BC"/><path d="M294 197H364" fill="none" stroke="#C5C9BC"/><circle cx="298" cy="226" r="3" fill="#86957D" stroke="none"/><rect x="408" y="107" width="111" height="137" rx="5" fill="#E5EAF6" stroke="none"/><text x="420" y="133" font-size="12" fill="#242822" font-weight="600" >生活随记</text><text x="420" y="158" font-size="9" fill="#71766C" font-weight="400" >发现日常的好看</text><path d="M420 180H503" fill="none" stroke="#C5C9BC"/><path d="M420 197H490" fill="none" stroke="#C5C9BC"/><circle cx="424" cy="226" r="3" fill="#86957D" stroke="none"/></g></svg><text x="46" y="422" font-size="14" fill="#71766C" font-weight="400" >把零散的灵感、阅读摘录和日常笔记，收进一</text><text x="46" y="445" font-size="14" fill="#71766C" font-weight="400" >个安静的小空间。</text><text x="46" y="478" font-size="11" fill="#71766C" font-weight="400" >React + TypeScript</text><a id="Action-notes-Demo" href="https://example.com/projects/notes" target="_blank" rel="noopener noreferrer" aria-label="Paper Notes · Demo"><title>Paper Notes · Demo</title><rect x="46" y="512" width="112" height="44" rx="22" fill="#2853E8" stroke="none"/><text x="64" y="540" font-size="13" fill="#FFF" font-weight="550" >Demo</text><g transform="translate(127,525) scale(0.75)" fill="none" stroke="#FFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 19 5M5 5h14v14"/></g></a